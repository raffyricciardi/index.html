<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D City Mobile - Missions</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #game-canvas { width: 100%; height: 100%; display: block; }
        
        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .stats-box { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .money { color: #10b981; font-size: 22px; font-weight: 800; }
        
        /* AVVISI MISSIONE */
        #mission-box { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 2px solid #f59e0b; color: #fff; padding: 10px 20px; border-radius: 20px; font-weight: bold; text-align: center; display: none; }
        #timer-box { font-size: 20px; color: #ef4444; }

        /* CONTROLLI TOUCH */
        .touch-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #joystick-zone { position: absolute; bottom: 35px; left: 35px; width: 110px; height: 110px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; backdrop-filter: blur(4px); pointer-events: auto; }
        #joystick-knob { position: absolute; top: 32.5px; left: 32.5px; width: 45px; height: 45px; background: #fff; border-radius: 50%; }

        .action-buttons { position: absolute; bottom: 35px; right: 25px; display: flex; gap: 14px; pointer-events: auto; }
        .btn { width: 58px; height: 58px; border-radius: 50%; background: rgba(15, 23, 42, 0.8); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .btn:active { transform: scale(0.92); }
        #btn-enter { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="hud">
        <div class="top-bar">
            <div class="stats-box">
                <div class="money">$<span id="money-val">0</span></div>
            </div>
            <div class="stats-box" style="text-align: right;">
                <div style="font-size: 11px; color: #94a3b8;" id="mode-label">A PIEDI</div>
                <div style="font-size: 20px; color: #38bdf8; font-weight: 700;"><span id="speed-val">0</span> <span style="font-size: 12px; color: #64748b;">KM/H</span></div>
            </div>
        </div>
        
        <div id="mission-box">
            <div id="mission-title">CONSEGNA L'AUTO ALLA ZONA DORATA!</div>
            <div id="timer-box">TEMPO: <span id="time-val">30</span>s</div>
        </div>
    </div>

    <div class="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div class="action-buttons">
            <div class="btn" id="btn-cam">📹</div>
            <div class="btn" id="btn-enter">🚗</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa5f3fc);
        scene.fog = new THREE.FogExp2(0xa5f3fc, 0.008);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
