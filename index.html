<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D GTA Mobile</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
        #game-canvas { width: 100%; height: 100%; display: block; }
        
        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .stats-box { background: rgba(0, 0, 0, 0.65); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; }
        .money { color: #2ecc71; font-size: 20px; font-weight: bold; }
        .health-bar-container { width: 120px; height: 10px; background: #444; border-radius: 5px; margin-top: 4px; overflow: hidden; }
        .health-bar { width: 100%; height: 100%; background: #2ecc71; }
        .wanted-stars { font-size: 18px; color: #555; }
        .wanted-stars .active { color: #f1c40f; }

        /* CONTROLLI TOUCH */
        .touch-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Joystick Joystick Left */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; pointer-events: auto; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; }

        /* Pulsanti Action Right */
        .action-buttons { position: absolute; bottom: 30px; right: 20px; display: flex; gap: 12px; pointer-events: auto; }
        .btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid #fff; color: #fff; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .btn:active { background: rgba(255,255,255,0.4); }
        #btn-enter { background: rgba(241, 196, 15, 0.8); color: #000; border: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="hud">
        <div class="top-bar">
            <div class="stats-box">
                <div class="money">$<span id="money-val">500</span></div>
                <div class="health-bar-container"><div class="health-bar" id="health-bar"></div></div>
                <div class="wanted-stars" id="wanted-stars">★ ★ ★ ★ ★</div>
            </div>
            <div class="stats-box" style="text-align: right;">
                <div style="font-size: 12px; color: #aaa;" id="mode-label">A PIEDI</div>
                <div style="font-size: 18px; color: #3498db;"><span id="speed-val">0</span> KM/H</div>
            </div>
        </div>
    </div>

    <div class="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div class="action-buttons">
            <div class="btn" id="btn-cam">📷</div>
            <div class="btn" id="btn-horn">📯</div>
            <div class="btn" id="btn-enter">🚗</div>
        </div>
    </div>

    <script>
        // Setup Three.js
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // Mappa base e Palazzi
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const buildings = [];
        for(let x = -4; x <= 4; x++) {
            for(let z = -4; z <= 4; z++) {
                if(x % 2 !== 0 && z % 2 !== 0) {
                    const h = Math.random() * 20 + 10;
                    const b = new THREE.Mesh(new THREE.BoxGeometry(18, h, 18), new THREE.MeshStandardMaterial({ color: 0x7f8c8d }));
                    b.position.set(x * 30, h/2, z * 30);
                    scene.add(b);
                    buildings.push(b);
                }
            }
        }

        // Giocatore
        const player = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.8), new THREE.MeshStandardMaterial({ color: 0x2980b9 }));
        player.position.set(0, 0.9, 0);
        scene.add(player);

        // Auto
        const cars = [];
        function createCar(x, z, color) {
            const car = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), new THREE.MeshStandardMaterial({ color }));
            body.position.y = 0.5;
            car.add(body);
            car.position.set(x, 0, z);
            scene.add(car);
            cars.push({ mesh: car, speed: 0 });
        }
        createCar(10, 10, 0xe74c3c);
        createCar(-15, 20, 0xf1c40f);

        // Stato Gioco
        let state = { mode: 'foot', activeCar: null, camView: 0 };
        let joystick = { active: false, x: 0, y: 0 };

        // LOGICA JOYSTICK TOUCH
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');

        zone.addEventListener('touchstart', handleTouch);
        zone.addEventListener('touchmove', handleTouch);
        zone.addEventListener('touchend', () => {
            knob.style.transform = `translate(0px, 0px)`;
            joystick = { active: false, x: 0, y: 0 };
        });

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);

            dx = Math.cos(angle) * dist;
            dy = Math.sin(angle) * dist;

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick = { active: true, x: dx / 40, y: dy / 40 };
        }

        // TASTI AZIONE TOUCH
        document.getElementById('btn-enter').onclick = () => {
            if(state.mode === 'foot') {
                cars.forEach(c => {
                    if(player.position.distanceTo(c.mesh.position) < 4) {
                        state.mode = 'driving';
                        state.activeCar = c;
                        player.visible = false;
                        document.getElementById('mode-label').innerText = "IN AUTO";
                    }
                });
            } else {
                player.position.copy(state.activeCar.mesh.position).add(new THREE.Vector3(2, 0, 0));
                player.visible = true;
                state.mode = 'foot';
                state.activeCar = null;
                document.getElementById('mode-label').innerText = "A PIEDI";
            }
        };

        document.getElementById('btn-cam').onclick = () => { state.camView = (state.camView + 1) % 2; };

        // LOOP DI GIOCO
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (joystick.active) {
                if (state.mode === 'foot') {
                    player.position.x += joystick.x * 10 * delta;
                    player.position.z += joystick.y * 10 * delta;
                    player.rotation.y = Math.atan2(joystick.x, joystick.y);
                } else if (state.mode === 'driving' && state.activeCar) {
                    const car = state.activeCar.mesh;
                    state.activeCar.speed = -joystick.y * 30;
                    car.rotation.y -= joystick.x * 2 * delta;
                    car.position.x += Math.sin(car.rotation.y) * state.activeCar.speed * delta;
                    car.position.z += Math.cos(car.rotation.y) * state.activeCar.speed * delta;
                    document.getElementById('speed-val').innerText = Math.round(Math.abs(state.activeCar.speed));
                }
            }

            // Telecamera
            const target = state.mode === 'driving' ? state.activeCar.mesh : player;
            if(state.camView === 0) {
                camera.position.set(target.position.x, target.position.y + 12, target.position.z + 18);
            } else {
                camera.position.set(target.position.x, target.position.y + 35, target.position.z + 0.1);
            }
            camera.lookAt(target.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
